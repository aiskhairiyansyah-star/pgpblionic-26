
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/maps"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit Point</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Edit Point</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="mapedit" style="height: 400px;"></div>

  <ion-item>
    <ion-label position="floating">Name</ion-label>
    <ion-input [(ngModel)]="name"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Coordinates</ion-label>
    <ion-input [(ngModel)]="coordinates"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Description</ion-label>
    <ion-textarea
      [(ngModel)]="description"
      placeholder="Enter point description"
      rows="4"
      [autoGrow]="true">
    </ion-textarea>
  </ion-item>

  <ion-button expand="full" (click)="save()">
    Save
  </ion-button>

</ion-content>
