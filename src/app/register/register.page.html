<ion-content [fullscreen]="true">
  <div class="card-section">

    <ion-card>

      <ion-card-header>
        <ion-card-title>Register</ion-card-title>
        <ion-card-subtitle>
          Create a new account
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="floating"
            placeholder="Enter your email" [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            type="password"
            label="Password"
            labelPlacement="floating"
            placeholder="Enter your password" [(ngModel)]="password">

            <ion-input-password-toggle
              slot="end">
            </ion-input-password-toggle>

          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            type="password"
            label="Confirm Password"
            labelPlacement="floating"
            placeholder="Enter your confirm password" [(ngModel)]="confirmPassword">

            <ion-input-password-toggle
              slot="end">
            </ion-input-password-toggle>

          </ion-input>
        </ion-item>

        <ion-button expand="block" (click)="register()">
          Register
        </ion-button>

        <!-- Login Button -->
        <ion-button
          expand="block"
          fill="clear"
          routerLink="/login">
          Already have an account? Login
        </ion-button>

      </ion-card-content>

    </ion-card>

  </div>
</ion-content>
